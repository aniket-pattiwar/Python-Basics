g><path d="M65 305q-1-49 5-87" stroke="#53754b" fill="none" stroke-width="3"/><path d="M69 265q-38-7-35-40 31 1 35 40M68 243q32-4 32-30-27 0-32 30M70 225q-21-12-14-32 23 10 14 32" fill="#84a16c"/><path d="M45 288h48l-7 55H52Z" fill="#dca876"/><path d="M43 288h52v8H43Z" fill="#bf895a"/></g><g transform="rotate(15 440 305)"><rect x="432" y="274" width="12" height="61" rx="3" fill="#d99b50"/><path d="M432 335l6 16 6-16Z" fill="#d4c1a0"/><path d="M436 346l2 5 2-5Z" fill="#435648"/></g><rect x="180" y="293" width="155" height="51" rx="9" fill="#1b514b" stroke="#1b514b"/><text x="198" y="314" style="font:10px Arial;fill:#bccfad">HELLO, POSSIBILITY.</text><text x="198" y="333" style="font:14px monospace;fill:#d9edb8">&gt;&gt;&gt; print(240)</text></svg>